name: Generate Proto

on:
  push:
    branches: [ "main" ]

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo A
        uses: actions/checkout@v3

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.22

      - name: Install protoc
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler

      - name: Install plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

      - name: Clone Repo B
        run: |
          git clone https://x-access-token:${{ secrets.PROTO_PUSH_TOKEN }}@github.com/alixx21/ap2-generated.git generated

      - name: Generate code
        run: |
          mkdir -p generated/payment
          mkdir -p generated/order

          protoc --go_out=generated/payment \
                 --go-grpc_out=generated/payment \
                 --go_opt=paths=source_relative \
                 --go-grpc_opt=paths=source_relative \
                 proto/payment.proto

          protoc --go_out=generated/order \
                 --go-grpc_out=generated/order \
                 --go_opt=paths=source_relative \
                 --go-grpc_opt=paths=source_relative \
                 proto/order.proto

      - name: Commit & Push to Repo B
        run: |
          cd generated
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "auto: generate proto" || echo "No changes"
          git push